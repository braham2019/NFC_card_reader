# Board: Seeed Studio XIAO ESP32C3

esphome:
  name: nfc-music
  friendly_name: nfc-music

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
logger:

api:
  encryption:
    key: "key"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

i2c:
  sda: GPIO6    # XIAO pin D4
  scl: GPIO7    # XIAO pin D5
  scan: true

pn532_i2c:
  update_interval: 1s
  on_tag:
    then:
      - lambda: |-
          ESP_LOGD("nfc", "Tag %s", x.c_str());
          if (tag.has_ndef_message()) {
            for (auto &record : tag.get_ndef_message()->get_records())
              ESP_LOGD("nfc", "NDEF: %s", record->get_payload().c_str());
          }
      - homeassistant.event:
          event: esphome.nfc_tag
          data:
            uid: !lambda 'return x;'
            payload: !lambda |-
              if (tag.has_ndef_message()) {
                const auto &records = tag.get_ndef_message()->get_records();
                if (!records.empty()) return records[0]->get_payload();
              }
              return std::string("");
